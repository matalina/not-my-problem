<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not My Problem Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141414;
    --frame: #3a3a3c;
    --frame-dark: #1f1f21;
    --rivet: #8b8b90;
    --blood: #c8141c;
    --blood-dark: #6e0a0e;
    --parch: #e9c27a;
    --parch-light: #f3d79c;
    --parch-edge: #b8873e;
    --ink: #2a1a0c;
    --stamp: rgba(170, 14, 20, .88);
    --gold: #f4c542;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(ellipse at top, #2a2a2c, var(--bg) 70%);
    color: var(--ink);
    font-family: "IM Fell English", Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .board {
    width: 100%;
    max-width: 980px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%),
      repeating-linear-gradient(45deg, #333 0 2px, #2c2c2e 2px 6px);
    border: 6px solid var(--frame-dark);
    outline: 3px solid var(--frame);
    border-radius: 14px;
    box-shadow: 0 0 0 2px #000, 0 20px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.8);
    padding: 18px;
    position: relative;
  }
  .board::before, .board::after {
    content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ddd, var(--rivet) 40%, #333);
    top: 10px;
  }
  .board::before { left: 10px; }
  .board::after { right: 10px; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 4px 8px 16px;
  }
  .emblem {
    flex: 0 0 auto;
    width: clamp(56px, 12vw, 110px); aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #4a4a4d, #1b1b1c 70%);
    border: 4px solid #555;
    box-shadow: inset 0 0 12px #000, 0 0 0 3px #111;
    display: grid; place-items: center;
    font-size: clamp(30px, 7vw, 62px);
    filter: drop-shadow(0 0 6px rgba(200,20,28,.5));
  }
  h1 {
    margin: 0; flex: 1;
    font-family: "Creepster", Impact, fantasy;
    font-weight: 400;
    font-size: clamp(34px, 9vw, 96px);
    line-height: 1;
    letter-spacing: 2px;
    color: var(--blood);
    text-shadow: 0 2px 0 var(--blood-dark), 0 4px 0 #300, 0 0 18px rgba(200,20,28,.55), 2px 6px 10px #000;
    text-align: center;
  }

  .status {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    color: #e6d3b0; font-size: 18px; padding: 0 6px 12px;
  }
  .status strong { color: var(--gold); }
  .bingo-banner {
    font-family: "Creepster", Impact, fantasy; color: var(--gold);
    font-size: 26px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(244,197,66,.6);
    visibility: hidden;
  }
  .bingo-banner.on { visibility: visible; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  button.reset {
    font: inherit; font-size: 16px;
    background: #2a2a2c; color: #e6d3b0;
    border: 2px solid #555; border-radius: 8px;
    padding: 6px 14px; cursor: pointer;
  }
  button.reset:hover { border-color: var(--blood); color: #fff; }
  button.reset.armed { background: var(--blood); border-color: #ff4a4a; color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 6px;
    background: var(--blood-dark);
    padding: 6px;
    border-radius: 8px;
    box-shadow: inset 0 0 10px #000;
  }
  .cell {
    position: relative;
    min-height: clamp(70px, 12vw, 135px);
    border: none; margin: 0;
    padding: 8px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: inherit;
    font-size: clamp(11px, 2.4vw, 25px);
    line-height: 1.25;
    color: var(--ink);
    cursor: pointer;
    border-radius: 3px;
    background:
      radial-gradient(ellipse at 30% 25%, var(--parch-light), transparent 60%),
      radial-gradient(ellipse at 75% 80%, rgba(150,95,30,.35), transparent 55%),
      var(--parch);
    box-shadow: inset 0 0 18px rgba(120,70,20,.55), inset 0 0 0 1px var(--parch-edge);
    transition: transform .08s ease, filter .15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:hover { filter: brightness(1.06); }
  .cell:active { transform: scale(.97); }
  .cell:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .cell span { position: relative; z-index: 1; }

  .cell.marked { filter: brightness(.88) sepia(.25); }
  .cell.marked::after {
    content: "";
    position: absolute; inset: 12%;
    border: 5px solid var(--stamp);
    border-radius: 50%;
    transform: rotate(-12deg);
    box-shadow: 0 0 0 2px rgba(170,14,20,.25), inset 0 0 0 2px rgba(170,14,20,.25);
    z-index: 2;
    pointer-events: none;
    animation: stamp .18s ease-out;
  }
  .cell.marked::before {
    content: "✕";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: "Creepster", Impact, fantasy;
    font-size: 3.4em;
    color: rgba(170,14,20,.35);
    z-index: 2; pointer-events: none;
  }
  @keyframes stamp { from { transform: rotate(-12deg) scale(1.5); opacity: 0; } }
  .cell.win { box-shadow: inset 0 0 18px rgba(120,70,20,.55), 0 0 0 3px var(--gold), 0 0 14px var(--gold); filter: none; }

  footer { color: #8f8577; font-size: 14px; text-align: center; padding-top: 12px; }

  @media (max-width: 560px) {
    .board { padding: 10px; border-width: 4px; }
    .grid { gap: 3px; padding: 3px; }
    .cell { padding: 3px; }
    .cell.marked::after { border-width: 3px; }
    header { gap: 8px; }
  }
</style>
</head>
<body>
<main class="board">
  <header>
    <div class="emblem" aria-hidden="true">💀</div>
    <h1>Not My Problem</h1>
  </header>

  <div class="status">
    <div><strong id="count">0</strong> / 25 marked</div>
    <div class="bingo-banner" id="banner">BINGO!</div>
    <button class="reset" id="reset" type="button">Reset card</button>
  </div>

  <div class="grid" id="grid" role="grid" aria-label="Bingo card"></div>

  <footer>Click a square to mark it. Progress saves automatically in this browser.</footer>
</main>

<script>
  const SQUARES = [
    "Roll 100 on a loot roll",
    "See a hunter pet named Dog",
    "Get a faction to Revered",
    "Fully explore a non-starter zone",
    "Ride a flight path for over 5 minutes",

    "Complete a dungeon with all guildies",
    "Acquire the sleeping bag",
    "See a Tolkien name (or any literary name)",
    "Run the Deadmines",
    "Craft a rare item",

    "Save a stranger from impending doom",
    "Get 5 buffs from a single campfire",
    "10 hrs /played",
    "Have 10 gold",
    "Find a waterfall",

    "Get an Alliance player to dance with you",
    "Learn to ride",
    "Die from fall damage",
    "Tell a story at a campfire",
    "Equip guild tabard",

    "Fish up an offhand fish",
    "Kill a rare",
    "Get pizza",
    "See an epic drop",
    "Collect a companion pets"
  ];

  const KEY = "not-my-problem-bingo-v1";
  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  const banner = document.getElementById("banner");

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(saved) && saved.length === 25) return saved.map(Boolean);
    } catch (e) {}
    return Array(25).fill(false);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(marked)); } catch (e) {}
  }

  let marked = load();

  const LINES = [];
  for (let i = 0; i < 5; i++) {
    LINES.push([0,1,2,3,4].map(c => i * 5 + c));   // rows
    LINES.push([0,1,2,3,4].map(r => r * 5 + i));   // columns
  }
  LINES.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]); // diagonals

  const cells = SQUARES.map((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell";
    b.setAttribute("role", "gridcell");
    b.innerHTML = "<span></span>";
    b.firstChild.textContent = text;
    b.addEventListener("click", () => {
      marked[i] = !marked[i];
      save();
      render();
    });
    grid.appendChild(b);
    return b;
  });

  function render() {
    const winners = new Set();
    let lines = 0;
    LINES.forEach(line => {
      if (line.every(i => marked[i])) { lines++; line.forEach(i => winners.add(i)); }
    });
    cells.forEach((c, i) => {
      c.classList.toggle("marked", marked[i]);
      c.classList.toggle("win", winners.has(i));
      c.setAttribute("aria-pressed", marked[i]);
    });
    countEl.textContent = marked.filter(Boolean).length;
    banner.textContent = lines > 1 ? `BINGO ×${lines}!` : "BINGO!";
    banner.classList.toggle("on", lines > 0);
  }

  // Two-click confirm on the button itself (popup dialogs can be blocked).
  const resetBtn = document.getElementById("reset");
  let armTimer = null;
  function disarm() {
    clearTimeout(armTimer);
    armTimer = null;
    resetBtn.classList.remove("armed");
    resetBtn.textContent = "Reset card";
  }
  resetBtn.addEventListener("click", () => {
    if (!armTimer) {
      resetBtn.classList.add("armed");
      resetBtn.textContent = "Click again to clear";
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    marked = Array(25).fill(false);
    save();
    render();
  });

  render();
</script>
</body>
</html>
